<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nailscape - Professional Booking System</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    input[type="password"] { font-size: 16px; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script>
    // ============ CONFIG — UPDATE THESE THREE BLOCKS ============
    const SUPABASE_URL = 'https://yoibrnqevcvzlwqdhite.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvaWJubmdldmN2emx3cWRoaXRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MTY0ODksImV4cCI6MjEwNDI5MjQ4OX0.M-AmLlXR46ciiO4SO0W0E829G6gslATDF9DJrSMdsUE';
    
    const EMAILJS_PUBLIC_KEY = 'XAY86qC56WaLpvftm';
    const EMAILJS_SERVICE_ID = 'service_gcau9wx';
    const EMAILJS_TEMPLATE_CONFIRM = 'template_alws55p';
    const EMAILJS_TEMPLATE_RESCHEDULE = 'template_chxluv5';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const e = React.createElement;
    const { useState, useEffect } = React;

    function NailscapeApp() {
      const [currentPage, setCurrentPage] = useState('booking');
      const [adminLoggedIn, setAdminLoggedIn] = useState(false);
      const [adminEmail, setAdminEmail] = useState('');
      const [adminPassword, setAdminPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [bookings, setBookings] = useState([]);
      const [bookingForm, setBookingForm] = useState({
        customerName: '',
        customerEmail: '',
        customerPhone: '',
        bookingDate: '',
        bookingTime: '',
        services: [],
        addOns: [],
        message: ''
      });
      const [showConfirmModal, setShowConfirmModal] = useState(false);
      const [pendingCode, setPendingCode] = useState('');
      const [searchCode, setSearchCode] = useState('');
      const [searchEmail, setSearchEmail] = useState('');
      const [adminFilter, setAdminFilter] = useState({
        searchCode: '',
        searchEmail: '',
        dateFrom: '',
        dateTo: '',
        status: 'all'
      });
      const [expandedBooking, setExpandedBooking] = useState(null);
      const [editingDateTime, setEditingDateTime] = useState(null);
      const [newDateTime, setNewDateTime] = useState({ date: '', time: '' });
      const [successMessage, setSuccessMessage] = useState('');
      const [errorMessage, setErrorMessage] = useState('');
      const [loading, setLoading] = useState(false);

      const services = [
        { id: 'gel-nails', name: 'Full Cover Gel Nails', price: 45, duration: 120, longService: true },
        { id: 'nail-repair', name: 'Nail Repair', price: 3, duration: 45, longService: false },
        { id: 'removal', name: 'Removal', price: 30, duration: 90, longService: true },
        { id: 'eyebrow', name: 'Eyebrow Threading', price: 10, duration: 15, longService: false },
        { id: 'lip', name: 'Upper Lip Threading', price: 5, duration: 10, longService: false }
      ];

      const addOns = [
        { id: 'french', name: 'French / Babyboomer', price: 5 },
        { id: 'art', name: 'Simple Nail Art', price: 5 },
        { id: 'form', name: 'Formkorrektur', price: 2 }
      ];

      const salonInfo = {
        name: 'Nailscape',
        phone: '+49 15259643211',
        email: 'nailscape.de@gmail.com',
        hours: '9:00 AM - 4:00 PM',
        address: 'Herzogenaurach, Germany'
      };

      // Check admin session on load
      useEffect(() => {
        const checkSession = async () => {
          const { data: { session } } = await supabase.auth.getSession();
          if (session) {
            setAdminLoggedIn(true);
            setAdminEmail(session.user.email);
          }
        };
        checkSession();
      }, []);

      // Load bookings on mount
      useEffect(() => {
        const loadBookings = async () => {
          const { data, error } = await supabase
            .from('bookings')
            .select('*')
            .order('booking_date', { ascending: false });
          if (!error && data) setBookings(data);
        };
        loadBookings();
      }, []);

      const generateBookingCode = () => {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let code = '';
        for (let i = 0; i < 6; i++) {
          code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return code;
      };

      const getMinDate = () => {
        const d = new Date();
        d.setDate(d.getDate() + 1);
        return d.toISOString().split('T')[0];
      };

      const getMaxDate = () => {
        const d = new Date();
        d.setDate(d.getDate() + 60);
        return d.toISOString().split('T')[0];
      };

      const calculateTotalPrice = () => {
        let total = 0;
        bookingForm.services.forEach(sid => {
          const svc = services.find(s => s.id === sid);
          if (svc) total += svc.price;
        });
        bookingForm.addOns.forEach(aid => {
          const ao = addOns.find(a => a.id === aid);
          if (ao) total += ao.price;
        });
        return total;
      };

      const calculateTotalDuration = () => {
        let total = 0;
        bookingForm.services.forEach(sid => {
          const svc = services.find(s => s.id === sid);
          if (svc) total += svc.duration;
        });
        return total;
      };

      const formatTimeSlots = () => {
        const slots = [];
        for (let h = 9; h < 16; h++) {
          for (let m = 0; m < 60; m += 30) {
            const time = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            slots.push(time);
          }
        }
        return slots;
      };

      const getAvailableSlots = (date) => {
        if (!date) return [];
        const selectedDate = new Date(date);
        const dayOfWeek = selectedDate.getDay();
        
        if (dayOfWeek === 0) return [];
        
        const allSlots = formatTimeSlots();
        const duration = calculateTotalDuration();
        const slotsNeeded = Math.ceil(duration / 30);

        return allSlots.filter((slot, idx) => {
          for (let i = 0; i < slotsNeeded; i++) {
            if (idx + i >= allSlots.length) return false;
          }

          for (let i = 0; i < slotsNeeded; i++) {
            const checkSlot = allSlots[idx + i];
            const isBooked = bookings.some(b => 
              b.booking_date === date && 
              b.booking_time === checkSlot && 
              b.status === 'confirmed'
            );
            if (isBooked) return false;
          }

          return true;
        });
      };

      const handleServiceToggle = (serviceId) => {
        setBookingForm(prev => ({
          ...prev,
          services: prev.services.includes(serviceId)
            ? prev.services.filter(s => s !== serviceId)
            : [...prev.services, serviceId]
        }));
      };

      const handleAddOnToggle = (addOnId) => {
        setBookingForm(prev => ({
          ...prev,
          addOns: prev.addOns.includes(addOnId)
            ? prev.addOns.filter(a => a !== addOnId)
            : [...prev.addOns, addOnId]
        }));
      };

      const handleSubmitBooking = (evt) => {
        evt.preventDefault();
        
        if (!bookingForm.customerName || !bookingForm.customerEmail || !bookingForm.customerPhone || 
            !bookingForm.bookingDate || !bookingForm.bookingTime || bookingForm.services.length === 0) {
          setErrorMessage('Please fill in all required fields');
          return;
        }

        const today = new Date().toISOString().split('T')[0];
        if (bookingForm.bookingDate === today) {
          setErrorMessage('Same day booking not possible, please contact via WhatsApp or email. Thank you!');
          return;
        }

        setPendingCode(generateBookingCode());
        setShowConfirmModal(true);
      };

      const handleConfirmBooking = async () => {
        setLoading(true);
        try {
          const newBooking = {
            code: pendingCode,
            customer_name: bookingForm.customerName,
            customer_email: bookingForm.customerEmail,
            customer_phone: bookingForm.customerPhone,
            booking_date: bookingForm.bookingDate,
            booking_time: bookingForm.bookingTime,
            services: bookingForm.services,
            add_ons: bookingForm.addOns,
            message: bookingForm.message,
            total_price: calculateTotalPrice(),
            duration: calculateTotalDuration(),
            status: 'confirmed'
          };

          const { data, error } = await supabase
            .from('bookings')
            .insert([newBooking])
            .select();

          if (error) throw error;

          // Send email via EmailJS
          await fetch('https://api.emailjs.com/api/v1.0/email/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              service_id: EMAILJS_SERVICE_ID,
              template_id: EMAILJS_TEMPLATE_CONFIRM,
              user_id: EMAILJS_PUBLIC_KEY,
              template_params: {
                to_email: bookingForm.customerEmail,
                customer_name: bookingForm.customerName,
                booking_code: pendingCode,
                booking_date: new Date(bookingForm.bookingDate).toLocaleDateString('de-DE'),
                booking_time: bookingForm.bookingTime,
                services: bookingForm.services.map(s => services.find(svc => svc.id === s)?.name).join(', '),
                duration: calculateTotalDuration(),
                total_price: calculateTotalPrice() + '€',
                manage_url: window.location.href
              }
            })
          });

          setBookings([...bookings, data[0]]);
          setShowConfirmModal(false);
          setSuccessMessage(`✓ Booking confirmed!\nYour Code: ${pendingCode}\n✓ Confirmation email sent to ${bookingForm.customerEmail}`);
          
          setBookingForm({
            customerName: '',
            customerEmail: '',
            customerPhone: '',
            bookingDate: '',
            bookingTime: '',
            services: [],
            addOns: [],
            message: ''
          });

          setTimeout(() => setSuccessMessage(''), 8000);
        } catch (err) {
          setErrorMessage('Booking failed: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleAdminLogin = async (evt) => {
        evt.preventDefault();
        setLoading(true);
        try {
          const { data, error } = await supabase.auth.signInWithPassword({
            email: adminEmail,
            password: adminPassword
          });

          if (error) throw error;

          setAdminLoggedIn(true);
          setErrorMessage('');
          setAdminPassword('');
          setShowPassword(false);
        } catch (err) {
          setErrorMessage(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setAdminLoggedIn(false);
        setAdminPassword('');
        setShowPassword(false);
      };

      const handleChangeDateTime = async (bookingId) => {
        if (!newDateTime.date || !newDateTime.time) {
          setErrorMessage('Select both date and time');
          return;
        }

        setLoading(true);
        try {
          const booking = bookings.find(b => b.id === bookingId);
          const oldDateTime = `${booking.booking_date} at ${booking.booking_time}`;
          const newDateTimeStr = `${newDateTime.date} at ${newDateTime.time}`;

          const { error } = await supabase
            .from('bookings')
            .update({ booking_date: newDateTime.date, booking_time: newDateTime.time })
            .eq('id', bookingId);

          if (error) throw error;

          // Send reschedule email
          await fetch('https://api.emailjs.com/api/v1.0/email/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              service_id: EMAILJS_SERVICE_ID,
              template_id: EMAILJS_TEMPLATE_RESCHEDULE,
              user_id: EMAILJS_PUBLIC_KEY,
              template_params: {
                to_email: booking.customer_email,
                customer_name: booking.customer_name,
                booking_code: booking.code,
                old_datetime: oldDateTime,
                new_datetime: newDateTimeStr,
                services: booking.services.map(s => services.find(svc => svc.id === s)?.name).join(', ')
              }
            })
          });

          const updatedBooking = { ...booking, booking_date: newDateTime.date, booking_time: newDateTime.time };
          setBookings(prev => prev.map(b => b.id === bookingId ? updatedBooking : b));

          setSuccessMessage(`✓ Appointment rescheduled!\n${oldDateTime} → ${newDateTimeStr}\n✓ Email sent to customer`);
          setEditingDateTime(null);
          setNewDateTime({ date: '', time: '' });

          setTimeout(() => setSuccessMessage(''), 5000);
        } catch (err) {
          setErrorMessage('Reschedule failed: ' + err.message);
        } finally {
          setLoading(false);
        }
      };

      const getFilteredBookings = () => {
        return bookings.filter(b => {
          if (adminFilter.searchCode && !b.code.includes(adminFilter.searchCode.toUpperCase())) return false;
          if (adminFilter.searchEmail && !b.customer_email.toLowerCase().includes(adminFilter.searchEmail.toLowerCase())) return false;
          if (adminFilter.dateFrom && b.booking_date < adminFilter.dateFrom) return false;
          if (adminFilter.dateTo && b.booking_date > adminFilter.dateTo) return false;
          if (adminFilter.status !== 'all' && b.status !== adminFilter.status) return false;
          return true;
        });
      };

      const getCustomerBookings = () => {
        return bookings.filter(b => 
          (b.code === searchCode.toUpperCase() && searchCode) ||
          (b.customer_email === searchEmail && searchEmail)
        );
      };

      const canCancelBooking = (bookingDate, bookingTime) => {
        const bookingDateTime = new Date(bookingDate + 'T' + bookingTime);
        const now = new Date();
        const hoursUntil = (bookingDateTime - now) / (1000 * 60 * 60);
        return hoursUntil > 24;
      };

      const renderConfirmModal = () => e('div', { className: 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50' },
        e('div', { className: 'bg-white rounded-xl shadow-2xl p-8 max-w-md w-full mx-4' },
          e('h2', { className: 'text-2xl font-bold text-amber-900 mb-4' }, 'Confirm Your Booking'),
          
          e('div', { className: 'mb-4 bg-blue-50 border-2 border-blue-300 p-4 rounded-lg text-center' },
            e('p', { className: 'text-xs text-gray-600 font-semibold mb-1' }, 'YOUR BOOKING CODE'),
            e('p', { className: 'text-3xl font-bold text-blue-900 tracking-widest' }, pendingCode),
            e('p', { className: 'text-xs text-gray-600 mt-1' }, 'Save this code to manage your booking')
          ),
          
          e('div', { className: 'space-y-3 text-sm mb-6 bg-amber-50 p-4 rounded-lg' },
            e('div', null,
              e('p', { className: 'text-gray-600 font-semibold' }, 'Date & Time:'),
              e('p', { className: 'text-amber-900 font-bold' }, new Date(bookingForm.bookingDate).toLocaleDateString('de-DE') + ' at ' + bookingForm.bookingTime)
            ),
            e('div', null,
              e('p', { className: 'text-gray-600 font-semibold' }, 'Services:'),
              e('p', { className: 'text-amber-900 text-xs' }, bookingForm.services.map(s => services.find(svc => svc.id === s)?.name).join(', '))
            ),
            e('div', null,
              e('p', { className: 'text-gray-600 font-semibold' }, 'Duration:'),
              e('p', { className: 'text-amber-900' }, calculateTotalDuration() + ' minutes')
            ),
            e('div', { className: 'border-t-2 border-amber-200 pt-2 mt-2' },
              e('p', { className: 'text-gray-600 font-semibold' }, 'Total Price:'),
              e('p', { className: 'text-2xl font-bold text-pink-600' }, calculateTotalPrice() + '€')
            )
          ),

          e('div', { className: 'space-y-3' },
            e('button', { 
              onClick: handleConfirmBooking,
              disabled: loading,
              className: 'w-full bg-gradient-to-r from-pink-400 to-rose-400 text-white font-bold py-3 rounded-lg hover:from-pink-500 hover:to-rose-500 disabled:opacity-50'
            }, loading ? 'Processing...' : '✓ Confirm Booking'),
            e('button', { 
              onClick: () => setShowConfirmModal(false),
              className: 'w-full bg-gray-300 text-gray-800 font-bold py-3 rounded-lg hover:bg-gray-400'
            }, 'Cancel')
          )
        )
      );

      const renderBookingPage = () => e('div', { className: 'min-h-screen bg-gradient-to-br from-amber-50 via-pink-50 to-rose-100' },
        e('header', { className: 'sticky top-0 z-50 bg-white shadow-lg border-b-4 border-amber-200' },
          e('div', { className: 'max-w-6xl mx-auto px-4 py-4 flex items-center justify-between' },
            e('div', { className: 'flex items-center gap-3' },
              e('div', { className: 'w-12 h-12 bg-gradient-to-br from-amber-200 to-pink-200 rounded-full flex items-center justify-center font-bold text-lg text-amber-900' }, 'NS'),
              e('div', null,
                e('h1', { className: 'text-2xl font-bold text-amber-900' }, 'Nailscape'),
                e('p', { className: 'text-xs text-pink-600' }, 'Nails & Brows')
              )
            ),
            e('div', { className: 'space-x-2' },
              e('button', { onClick: () => { setCurrentPage('search'); setSearchCode(''); setSearchEmail(''); }, className: 'px-4 py-2 bg-blue-400 text-white rounded-lg font-semibold hover:bg-blue-500 text-sm' }, 'My Bookings'),
              e('button', { onClick: () => setCurrentPage('admin'), className: 'px-4 py-2 bg-pink-400 text-white rounded-lg font-semibold hover:bg-pink-500 text-sm' }, 'Admin')
            )
          )
        ),

        e('div', { className: 'max-w-6xl mx-auto px-4 py-8' },
          e('div', { className: 'grid md:grid-cols-3 gap-8' },
            e('div', { className: 'md:col-span-1' },
              e('div', { className: 'bg-white rounded-xl shadow-lg p-6 border-2 border-amber-200 mb-6' },
                e('h3', { className: 'text-lg font-bold text-amber-900 mb-4' }, 'Contact Us'),
                e('div', { className: 'space-y-3 text-sm' },
                  e('div', null, e('p', { className: 'text-gray-600' }, 'WhatsApp'), e('a', { href: 'https://wa.me/49152596432211', target: '_blank', className: 'font-semibold text-amber-900' }, salonInfo.phone)),
                  e('div', null, e('p', { className: 'text-gray-600' }, 'Email'), e('a', { href: `mailto:${salonInfo.email}`, className: 'font-semibold text-amber-900' }, salonInfo.email)),
                  e('div', null, e('p', { className: 'text-gray-600' }, 'Hours'), e('p', { className: 'font-semibold text-amber-900' }, salonInfo.hours)),
                  e('div', null, e('p', { className: 'text-gray-600' }, 'Location'), e('p', { className: 'font-semibold text-amber-900' }, salonInfo.address))
                )
              ),
              
              e('div', { className: 'bg-white rounded-xl shadow-lg p-6 border-2 border-amber-200' },
                e('h3', { className: 'text-lg font-bold text-amber-900 mb-4' }, 'Services & Pricing'),
                e('div', { className: 'space-y-2 text-sm' },
                  services.map(s => e('div', { key: s.id, className: 'flex justify-between pb-2 border-b border-amber-100' },
                    e('span', { className: 'text-amber-900 font-semibold text-xs' }, s.name),
                    e('span', { className: 'text-pink-600 font-bold' }, s.price + '€')
                  )),
                  e('div', { className: 'pt-3 mt-3 border-t-2 border-amber-300' },
                    e('p', { className: 'font-bold text-amber-900 mb-2 text-xs' }, 'Add-Ons'),
                    addOns.map(a => e('div', { key: a.id, className: 'flex justify-between text-xs py-1' },
                      e('span', { className: 'text-gray-700' }, a.name),
                      e('span', { className: 'font-semibold text-pink-600' }, '+' + a.price + '€')
                    ))
                  )
                )
              )
            ),

            e('div', { className: 'md:col-span-2' },
              e('div', { className: 'bg-white rounded-xl shadow-lg p-8 border-2 border-pink-200' },
                e('h2', { className: 'text-3xl font-bold text-amber-900 mb-2' }, 'Book Your Appointment'),
                e('p', { className: 'text-gray-600 mb-6' }, 'Minimum 24 hours in advance • Monday - Saturday'),
                
                successMessage && e('div', { className: 'mb-6 bg-green-100 border-l-4 border-green-500 p-4 rounded' },
                  e('p', { className: 'text-green-800 font-semibold text-sm whitespace-pre-wrap' }, successMessage)
                ),
                
                errorMessage && e('div', { className: 'mb-6 bg-red-100 border-l-4 border-red-500 p-4 rounded' },
                  e('p', { className: 'text-red-800 font-semibold text-sm' }, errorMessage)
                ),

                e('form', { onSubmit: handleSubmitBooking, className: 'space-y-6' },
                  e('div', { className: 'border-b-2 border-pink-100 pb-6' },
                    e('h3', { className: 'font-bold text-amber-900 mb-4' }, 'Your Information'),
                    e('input', { type: 'text', placeholder: 'Full Name *', value: bookingForm.customerName, onChange: evt => setBookingForm({...bookingForm, customerName: evt.target.value}), className: 'w-full px-4 py-2 border-2 border-amber-200 rounded-lg mb-3', required: true }),
                    e('input', { type: 'email', placeholder: 'Email *', value: bookingForm.customerEmail, onChange: evt => setBookingForm({...bookingForm, customerEmail: evt.target.value}), className: 'w-full px-4 py-2 border-2 border-amber-200 rounded-lg mb-3', required: true }),
                    e('input', { type: 'tel', placeholder: 'Phone Number *', value: bookingForm.customerPhone, onChange: evt => setBookingForm({...bookingForm, customerPhone: evt.target.value}), className: 'w-full px-4 py-2 border-2 border-amber-200 rounded-lg', required: true })
                  ),

                  e('div', { className: 'border-b-2 border-pink-100 pb-6' },
                    e('h3', { className: 'font-bold text-amber-900 mb-4' }, 'Select Services * (Multiple OK)'),
                    e('div', { className: 'space-y-2' },
                      services.map(s => e('label', { key: s.id, className: 'flex items-center p-3 border-2 border-amber-200 rounded-lg cursor-pointer hover:bg-amber-50' },
                        e('input', { type: 'checkbox', checked: bookingForm.services.includes(s.id), onChange: () => handleServiceToggle(s.id), className: 'w-4 h-4' }),
                        e('div', { className: 'ml-3 flex-1' },
                          e('p', { className: 'font-semibold text-amber-900 text-sm' }, s.name),
                          e('p', { className: 'text-xs text-gray-600' }, s.duration + ' min • ' + s.price + '€')
                        )
                      ))
                    )
                  ),

                  e('div', { className: 'border-b-2 border-pink-100 pb-6' },
                    e('h3', { className: 'font-bold text-amber-900 mb-4' }, 'Add-Ons (Optional)'),
                    e('div', { className: 'space-y-2' },
                      addOns.map(a => e('label', { key: a.id, className: 'flex items-center p-3 border-2 border-amber-200 rounded-lg cursor-pointer hover:bg-amber-50' },
                        e('input', { type: 'checkbox', checked: bookingForm.addOns.includes(a.id), onChange: () => handleAddOnToggle(a.id), className: 'w-4 h-4' }),
                        e('div', { className: 'ml-3 flex-1' },
                          e('p', { className: 'font-semibold text-amber-900 text-sm' }, a.name)
                        ),
                        e('span', { className: 'text-pink-600 font-bold text-sm' }, '+' + a.price + '€')
                      ))
                    )
                  ),

                  e('div', { className: 'border-b-2 border-pink-100 pb-6' },
                    e('h3', { className: 'font-bold text-amber-900 mb-4' }, 'Date & Time *'),
                    e('input', { type: 'date', value: bookingForm.bookingDate, onChange: evt => setBookingForm({...bookingForm, bookingDate: evt.target.value, bookingTime: ''}), min: getMinDate(), max: getMaxDate(), className: 'w-full px-4 py-2 border-2 border-amber-200 rounded-lg mb-4', required: true }),
                    
                    bookingForm.bookingDate && e('div', null,
                      e('p', { className: 'text-sm text-gray-600 mb-2' }, 'Available Time Slots:'),
                      e('div', { className: 'grid grid-cols-4 gap-2' },
                        getAvailableSlots(bookingForm.bookingDate).map(slot => e('button', {
                          key: slot,
                          type: 'button',
                          onClick: () => setBookingForm({...bookingForm, bookingTime: slot}),
                          className: 'px-3 py-2 rounded text-sm ' + (bookingForm.bookingTime === slot ? 'bg-pink-400 text-white font-bold' : 'bg-amber-100 text-amber-900 hover:bg-amber-200')
                        }, slot))
                      )
                    )
                  ),

                  e('div', { className: 'pb-6' },
                    e('h3', { className: 'font-bold text-amber-900 mb-4' }, 'Message (Optional)'),
                    e('textarea', { placeholder: 'Special requests...', value: bookingForm.message, onChange: evt => setBookingForm({...bookingForm, message: evt.target.value}), className: 'w-full px-4 py-2 border-2 border-amber-200 rounded-lg h-20 text-sm' })
                  ),

                  e('div', { className: 'bg-gradient-to-r from-amber-100 to-pink-100 p-4 rounded-lg border-2 border-amber-300 mb-6' },
                    e('div', { className: 'flex justify-between items-center' },
                      e('span', { className: 'font-bold text-amber-900' }, 'Total Price:'),
                      e('span', { className: 'text-3xl font-bold text-pink-600' }, calculateTotalPrice() + '€')
                    )
                  ),

                  e('button', { type: 'submit', disabled: loading, className: 'w-full bg-gradient-to-r from-pink-400 to-rose-400 text-white font-bold py-3 rounded-lg hover:from-pink-500 hover:to-rose-500 disabled:opacity-50' }, 'Review & Confirm Booking')
                )
              )
            )
          )
        ),

        showConfirmModal && renderConfirmModal()
      );

      const renderSearchPage = () => e('div', { className: 'min-h-screen bg-gray-100' },
        e('header', { className: 'bg-white shadow-lg border-b-4 border-blue-400' },
          e('div', { className: 'max-w-4xl mx-auto px-4 py-4 flex items-center justify-between' },
            e('h1', { className: 'text-2xl font-bold text-amber-900' }, 'My Bookings'),
            e('button', { onClick: () => { setCurrentPage('booking'); setSearchCode(''); setSearchEmail(''); }, className: 'px-4 py-2 bg-gray-300 text-gray-800 rounded hover:bg-gray-400' }, 'Back')
          )
        ),

        e('div', { className: 'max-w-4xl mx-auto p-4' },
          e('div', { className: 'bg-white rounded-lg shadow p-6 mb-6' },
            e('h3', { className: 'font-bold text-lg text-amber-900 mb-4' }, 'Find Your Appointment'),
            e('div', { className: 'space-y-3' },
              e('input', { type: 'text', placeholder: 'Enter Booking Code (e.g., ABC123)', value: searchCode, onChange: evt => setSearchCode(evt.target.value), className: 'w-full px-4 py-2 border-2 border-blue-200 rounded-lg' }),
              e('p', { className: 'text-sm text-gray-600 text-center' }, 'OR'),
              e('input', { type: 'email', placeholder: 'Enter Your Email', value: searchEmail, onChange: evt => setSearchEmail(evt.target.value), className: 'w-full px-4 py-2 border-2 border-blue-200 rounded-lg' })
            )
          ),

          getCustomerBookings().length === 0 ? e('div', { className: 'bg-white rounded-lg shadow p-6 text-center text-gray-600' }, 'No bookings found. Enter your code or email to search.') :
          e('div', { className: 'space-y-4' },
            getCustomerBookings().map(booking => e('div', { key: booking.id, className: 'bg-white rounded-lg shadow' },
              e('div', { className: 'p-6 border-b-2 border-blue-200' },
                e('div', { className: 'flex justify-between items-start mb-3' },
                  e('div', null,
                    e('p', { className: 'font-bold text-lg text-amber-900' }, booking.customer_name),
                    e('p', { className: 'text-sm bg-blue-100 text-blue-900 font-bold inline-block px-3 py-1 rounded' }, 'Code: ' + booking.code)
                  ),
                  e('span', { className: 'px-3 py-1 rounded text-xs font-semibold bg-green-100 text-green-800' }, booking.status)
                ),
                e('div', { className: 'grid grid-cols-2 gap-4 text-sm' },
                  e('div', null, e('p', { className: 'text-gray-600 font-semibold' }, 'Date & Time:'), e('p', { className: 'text-amber-900 font-bold' }, booking.booking_date + ' ' + booking.booking_time)),
                  e('div', null, e('p', { className: 'text-gray-600 font-semibold' }, 'Price:'), e('p', { className: 'text-pink-600 font-bold' }, booking.total_price + '€')),
                  e('div', null, e('p', { className: 'text-gray-600 font-semibold' }, 'Duration:'), e('p', { className: 'text-amber-900' }, booking.duration + ' min')),
                  e('div', null, e('p', { className: 'text-gray-600 font-semibold' }, 'Services:'), e('p', { className: 'text-amber-900 text-xs' }, booking.services.map(s => services.find(svc => svc.id === s)?.name).join(', ')))
                ),
                booking.message && e('div', { className: 'mt-3 p-2 bg-amber-50 rounded' }, e('p', { className: 'text-xs font-semibold text-gray-600' }, 'Note: '), e('p', { className: 'text-xs text-amber-900' }, booking.message)),
                e('div', { className: 'flex gap-2 mt-4' },
                  e('a', { href: `mailto:${booking.customer_email}`, className: 'px-3 py-1 bg-green-500 text-white rounded text-xs hover:bg-green-600' }, 'Email'),
                  e('a', { href: `https://wa.me/${booking.customer_phone.replace(/[^0-9]/g, '')}`, target: '_blank', className: 'px-3 py-1 bg-green-600 text-white rounded text-xs hover:bg-green-700' }, 'WhatsApp'),
                  canCancelBooking(booking.booking_date, booking.booking_time) && e('a', { href: `mailto:${salonInfo.email}?subject=Cancel Appointment ${booking.code}`, className: 'px-3 py-1 bg-red-500 text-white rounded text-xs hover:bg-red-600' }, 'Request Cancel')
                )
              )
            ))
          )
        )
      );

      const renderAdminPage = () => e('div', { className: 'min-h-screen bg-gray-100' },
        e('header', { className: 'bg-white shadow-lg border-b-4 border-pink-400' },
          e('div', { className: 'max-w-7xl mx-auto px-4 py-4 flex items-center justify-between' },
            e('h1', { className: 'text-2xl font-bold text-amber-900' }, 'Nailscape Admin'),
            e('div', { className: 'space-x-2' },
              e('button', { onClick: () => setCurrentPage('booking'), className: 'px-4 py-2 bg-amber-400 text-white rounded font-semibold hover:bg-amber-500' }, '← Booking Page'),
              adminLoggedIn && e('button', { onClick: handleLogout, className: 'px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600' }, 'Logout')
            )
          )
        ),

        !adminLoggedIn ? e('div', { className: 'max-w-md mx-auto mt-10 bg-white p-8 rounded-lg shadow-lg' },
          e('h2', { className: 'text-2xl font-bold text-amber-900 mb-6' }, 'Admin Login'),
          e('form', { onSubmit: handleAdminLogin, className: 'space-y-4' },
            e('input', { type: 'email', placeholder: 'Email', value: adminEmail, onChange: evt => setAdminEmail(evt.target.value), className: 'w-full px-4 py-2 border-2 border-amber-200 rounded-lg', required: true }),
            e('div', { className: 'relative' },
              e('input', { type: showPassword ? 'text' : 'password', placeholder: 'Password', value: adminPassword, onChange: evt => setAdminPassword(evt.target.value), className: 'w-full px-4 py-2 border-2 border-amber-200 rounded-lg pr-10', required: true }),
              e('button', { type: 'button', onClick: () => setShowPassword(!showPassword), className: 'absolute right-3 top-2 text-gray-600 font-bold text-lg' }, showPassword ? '👁️' : '🔒')
            ),
            errorMessage && e('div', { className: 'text-red-600 text-sm font-semibold' }, errorMessage),
            e('button', { type: 'submit', disabled: loading, className: 'w-full bg-pink-400 text-white font-bold py-2 rounded hover:bg-pink-500 disabled:opacity-50' }, loading ? 'Logging in...' : 'Login')
          )
        ) : e('div', { className: 'max-w-7xl mx-auto p-4' },
          successMessage && e('div', { className: 'mb-4 bg-green-100 border-l-4 border-green-500 p-4 rounded' },
            e('p', { className: 'text-green-800 font-semibold text-sm whitespace-pre-wrap' }, successMessage)
          ),
          
          e('div', { className: 'grid md:grid-cols-3 gap-6' },
            e('div', { className: 'md:col-span-1' },
              e('div', { className: 'bg-white rounded-lg shadow p-4' },
                e('h3', { className: 'font-bold text-lg text-amber-900 mb-4' }, 'Search Bookings'),
                e('div', { className: 'space-y-3' },
                  e('input', { type: 'text', placeholder: 'Booking Code', value: adminFilter.searchCode, onChange: evt => setAdminFilter({...adminFilter, searchCode: evt.target.value}), className: 'w-full px-3 py-2 border rounded text-sm' }),
                  e('input', { type: 'email', placeholder: 'Email', value: adminFilter.searchEmail, onChange: evt => setAdminFilter({...adminFilter, searchEmail: evt.target.value}), className: 'w-full px-3 py-2 border rounded text-sm' }),
                  e('input', { type: 'date', value: adminFilter.dateFrom, onChange: evt => setAdminFilter({...adminFilter, dateFrom: evt.target.value}), className: 'w-full px-3 py-2 border rounded text-sm' }),
                  e('input', { type: 'date', value: adminFilter.dateTo, onChange: evt => setAdminFilter({...adminFilter, dateTo: evt.target.value}), className: 'w-full px-3 py-2 border rounded text-sm' }),
                  e('select', { value: adminFilter.status, onChange: evt => setAdminFilter({...adminFilter, status: evt.target.value}), className: 'w-full px-3 py-2 border rounded text-sm' },
                    e('option', { value: 'all' }, 'All Status'),
                    e('option', { value: 'confirmed' }, 'Confirmed'),
                    e('option', { value: 'completed' }, 'Completed'),
                    e('option', { value: 'cancelled' }, 'Cancelled')
                  )
                )
              )
            ),

            e('div', { className: 'md:col-span-2' },
              e('div', { className: 'bg-white rounded-lg shadow' },
                e('div', { className: 'p-4 border-b' },
                  e('h3', { className: 'font-bold text-lg text-amber-900' }, 'Bookings (' + getFilteredBookings().length + ')')
                ),
                e('div', { className: 'divide-y max-h-96 overflow-y-auto' },
                  getFilteredBookings().length === 0 ? e('div', { className: 'p-4 text-gray-500 text-center' }, 'No bookings') :
                  getFilteredBookings().map(booking => e('div', { key: booking.id, className: 'p-4 hover:bg-gray-50 cursor-pointer' },
                    e('div', { className: 'flex justify-between items-start' },
                      e('div', null,
                        e('p', { className: 'font-semibold text-amber-900' }, booking.customer_name),
                        e('p', { className: 'text-xs bg-blue-100 text-blue-900 font-bold inline-block px-2 py-1 rounded mt-1' }, 'Code: ' + booking.code),
                        e('p', { className: 'text-sm text-gray-600 mt-1' }, booking.booking_date + ' ' + booking.booking_time),
                        e('p', { className: 'text-sm text-pink-600 font-bold' }, booking.total_price + '€')
                      ),
                      e('span', { className: 'px-3 py-1 rounded text-xs font-semibold bg-green-100 text-green-800' }, booking.status)
                    ),
                    
                    expandedBooking === booking.id ? e('div', { className: 'mt-4 pt-4 border-t space-y-3 text-sm' },
                      e('p', null, e('span', { className: 'font-semibold' }, 'Email: '), booking.customer_email),
                      e('p', null, e('span', { className: 'font-semibold' }, 'Phone: '), booking.customer_phone),
                      e('p', null, e('span', { className: 'font-semibold' }, 'Services: '), booking.services.map(s => services.find(svc => svc.id === s)?.name).join(', ')),
                      e('p', null, e('span', { className: 'font-semibold' }, 'Duration: '), booking.duration + ' min'),
                      booking.message && e('p', null, e('span', { className: 'font-semibold' }, 'Message: '), booking.message),
                      
                      editingDateTime === booking.id ? e('div', { className: 'bg-blue-50 p-3 rounded mt-3' },
                        e('p', { className: 'font-semibold mb-2 text-xs' }, 'Reschedule Appointment:'),
                        e('input', { type: 'date', value: newDateTime.date, onChange: evt => setNewDateTime({...newDateTime, date: evt.target.value}), className: 'w-full px-2 py-1 border rounded text-xs mb-2' }),
                        e('div', { className: 'grid grid-cols-4 gap-1 mb-2' },
                          formatTimeSlots().map(slot => e('button', {
                            key: slot,
                            type: 'button',
                            onClick: () => setNewDateTime({...newDateTime, time: slot}),
                            className: 'px-2 py-1 rounded text-xs ' + (newDateTime.time === slot ? 'bg-pink-400 text-white' : 'bg-gray-200 hover:bg-gray-300')
                          }, slot))
                        ),
                        e('div', { className: 'flex gap-2' },
                          e('button', { onClick: () => handleChangeDateTime(booking.id), disabled: loading, className: 'px-2 py-1 bg-green-500 text-white rounded text-xs hover:bg-green-600 disabled:opacity-50' }, 'Save'),
                          e('button', { onClick: () => { setEditingDateTime(null); setNewDateTime({date: '', time: ''}); }, className: 'px-2 py-1 bg-gray-400 text-white rounded text-xs' }, 'Cancel')
                        )
                      ) : e('div', { className: 'flex gap-2 pt-2 flex-wrap mt-2' },
                        e('button', { onClick: () => setEditingDateTime(booking.id), className: 'px-3 py-1 bg-blue-500 text-white rounded text-xs hover:bg-blue-600' }, 'Reschedule'),
                        e('button', { onClick: async () => { await supabase.from('bookings').update({ status: booking.status === 'confirmed' ? 'completed' : 'confirmed' }).eq('id', booking.id); setBookings(prev => prev.map(b => b.id === booking.id ? {...b, status: booking.status === 'confirmed' ? 'completed' : 'confirmed'} : b)); }, className: 'px-3 py-1 bg-purple-500 text-white rounded text-xs hover:bg-purple-600' }, 'Complete'),
                        canCancelBooking(booking.booking_date, booking.booking_time) && e('button', { onClick: async () => { await supabase.from('bookings').update({ status: 'cancelled' }).eq('id', booking.id); setBookings(prev => prev.map(b => b.id === booking.id ? {...b, status: 'cancelled'} : b)); }, className: 'px-3 py-1 bg-red-500 text-white rounded text-xs hover:bg-red-600' }, 'Cancel'),
                        e('a', { href: `mailto:${booking.customer_email}`, className: 'px-3 py-1 bg-green-500 text-white rounded text-xs hover:bg-green-600' }, 'Email'),
                        e('a', { href: `https://wa.me/${booking.customer_phone.replace(/[^0-9]/g, '')}`, target: '_blank', className: 'px-3 py-1 bg-green-600 text-white rounded text-xs hover:bg-green-700' }, 'WhatsApp')
                      ),
                      e('button', { onClick: () => setExpandedBooking(null), className: 'w-full mt-2 text-blue-600 text-xs hover:underline' }, 'Collapse')
                    ) : e('button', { onClick: () => setExpandedBooking(booking.id), className: 'w-full text-left text-blue-600 text-xs hover:underline mt-2' }, '+ View Details')
                  ))
                )
              )
            )
          )
        )
      );

      if (currentPage === 'booking') return renderBookingPage();
      if (currentPage === 'search') return renderSearchPage();
      if (currentPage === 'admin') return renderAdminPage();
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(NailscapeApp));
  </script>
</body>
</html>
