        email: 'nailscape.de@gmail.com',
        hours: '9:00 AM - 4:00 PM',
        address: 'Herzogenaurach, Germany',
        confirmationMsg: 'Thank you for booking an appointment. Please get back to me for any questions regarding the service. Looking forward for our appointment.'
      };

      const getMinDate = () => {
        const date = new Date();
        date.setDate(date.getDate() + 2);
        return date.toISOString().split('T')[0];
      };

      const getMaxDate = () => {
        const date = new Date();
        date.setDate(date.getDate() + 60);
        return date.toISOString().split('T')[0];
      };

      const calculateTotalPrice = () => {
        if (!bookingForm.serviceMain) return 0;
        const mainService = mainServices.find(s => s.id === bookingForm.serviceMain);
        let total = mainService.price;
        if (mainService.variable && mainService.id === 'nail-repair') {
          total = mainService.price * bookingForm.nailsForRepair;
        }
        bookingForm.addOns.forEach(addonId => {
          const addon = addOns.find(a => a.id === addonId);
          if (addon) total += addon.price;
        });
        return total;
      };

      const handleAddOnToggle = (addonId) => {
        setBookingForm(prev => ({
          ...prev,
          addOns: prev.addOns.includes(addonId) ? prev.addOns.filter(id => id !== addonId) : [...prev.addOns, addonId]
        }));
      };

      const handleBooking = (event) => {
        event.preventDefault();
        if (!bookingForm.customerName || !bookingForm.customerEmail || !bookingForm.customerPhone || !bookingForm.bookingDate || !bookingForm.serviceMain) {
          alert('Please fill in all required fields');
          return;
        }
        const booking = { id: Date.now(), ...bookingForm, totalPrice: calculateTotalPrice(), status: 'confirmed', createdAt: new Date().toLocaleString('de-DE') };
        setAllBookings(prev => [...prev, booking]);
        setSubmittedMessage('✓ Booking confirmed! We will contact you shortly.');
        setBookingForm({ customerName: '', customerEmail: '', customerPhone: '', bookingDate: '', serviceMain: '', nailsForRepair: 1, addOns: [], message: '' });
        setTimeout(() => setSubmittedMessage(''), 5000);
      };

      const handleAddBlockedDate = () => {
        if (newBlockedDate) {
          setBlockedDates(prev => [...prev, { date: newBlockedDate, reason: newBlockedReason }]);
          setNewBlockedDate('');
          setNewBlockedReason('');
        }
      };

      const handleAdminLogin = (event) => {
        event.preventDefault();
        if (adminPassword === 'nailscape2024') {
          setIsAdminLoggedIn(true);
          setAdminPassword('');
        } else {
          alert('Invalid password');
        }
      };

          e('div', { className: 'max-w-6xl mx-auto px-4 py-4 flex items-center justify-between' },

                e('p', { className: 'text-xs text-pink-600' }, 'Nails & Brows')

            e('div', { className: 'hidden md:flex gap-4' },
              e('button', { onClick: () => { setActiveTab('booking'); setIsAdminLoggedIn(false); }, className: activeTab === 'booking' && !isAdminLoggedIn ? 'px-6 py-2 rounded-lg font-semibold bg-amber-400 text-white' : 'px-6 py-2 rounded-lg font-semibold text-amber-900 hover:bg-amber-100' }, 'Booking'),

            e('div', { className: 'md:col-span-1' },

                e('div', { className: 'p-6 space-y-4' },
                  e('div', { className: 'flex items-center gap-3' }, e('div', null, e('p', { className: 'text-xs text-gray-500' }, 'WhatsApp'), e('a', { href: 'https://wa.me/49152596432211', target: '_blank', rel: 'noopener noreferrer', className: 'font-semibold text-amber-900 hover:text-pink-600' }, salonInfo.phone))),
                  e('div', { className: 'flex items-center gap-3' }, e('div', null, e('p', { className: 'text-xs text-gray-500' }, 'Email'), e('a', { href: `mailto:${salonInfo.email}`, className: 'font-semibold text-amber-900' }, salonInfo.email))),

                  e('div', { className: 'flex items-center gap-3' }, e('div', null, e('p', { className: 'text-xs text-gray-500' }, 'Location'), e('p', { className: 'font-semibold text-amber-900' }, salonInfo.address)))
                )
              ),
              e('div', { className: 'bg-white rounded-xl shadow-lg p-6 border-2 border-amber-200' },
                e('h3', { className: 'text-lg font-bold text-amber-900 mb-4' }, 'Services & Pricing'),
                e('div', { className: 'space-y-3 text-sm' },
                  mainServices.map(service => e('div', { key: service.id, className: 'pb-3 border-b border-amber-100' }, e('div', { className: 'flex justify-between' }, e('div', null, e('p', { className: 'font-semibold text-amber-900' }, service.name)), e('div', { className: 'text-right' }, e('p', { className: 'font-bold text-pink-600' }, service.price + '€'), e('p', { className: 'text-xs text-gray-500' }, service.duration + ' min'))))),

                )
              )
            ),
            e('div', { className: 'md:col-span-2' },
              e('div', { className: 'bg-white rounded-xl shadow-lg p-8 border-2 border-pink-200' },
                e('h2', { className: 'text-2xl font-bold text-amber-900 mb-2' }, 'Book an Appointment'),
                e('p', { className: 'text-gray-600 mb-6' }, 'Minimum 24 hours in advance'),
                submittedMessage && e('div', { className: 'mb-6 bg-green-100 border-l-4 border-green-500 p-4' }, e('p', { className: 'text-green-800 font-semibold' }, submittedMessage)),
                e('form', { onSubmit: handleBooking, className: 'space-y-6' },
                  e('div', { className: 'border-b-2 border-pink-100 pb-6' }, e('h3', { className: 'font-bold text-amber-900 mb-4' }, 'Your Info'), e('input', { type: 'text', placeholder: 'Name *', value: bookingForm.customerName, onChange: (evt) => setBookingForm({...bookingForm, customerName: evt.target.value}), className: 'w-full px-4 py-2 border-2 border-amber-200 rounded-lg mb-2' }), e('input', { type: 'email', placeholder: 'Email *', value: bookingForm.customerEmail, onChange: (evt) => setBookingForm({...bookingForm, customerEmail: evt.target.value}), className: 'w-full px-4 py-2 border-2 border-amber-200 rounded-lg mb-2' }), e('input', { type: 'tel', placeholder: 'Phone *', value: bookingForm.customerPhone, onChange: (evt) => setBookingForm({...bookingForm, customerPhone: evt.target.value}), className: 'w-full px-4 py-2 border-2 border-amber-200 rounded-lg' })),

                  e('div', { className: 'pb-6' }, e('h3', { className: 'font-bold text-amber-900 mb-4' }, 'Message'), e('textarea', { placeholder: 'Special requests...', value: bookingForm.message, onChange: (evt) => setBookingForm({...bookingForm, message: evt.target.value}), className: 'w-full px-4 py-2 border-2 border-amber-200 rounded-lg h-20' })),
                  e('div', { className: 'bg-gradient-to-r from-amber-100 to-pink-100 p-4 rounded-lg border-2 border-amber-300 mb-6' }, e('div', { className: 'flex justify-between' }, e('span', { className: 'font-bold text-amber-900' }, 'Total:'), e('span', { className: 'text-3xl font-bold text-pink-600' }, calculateTotalPrice() + '€'))),
                  e('button', { type: 'submit', className: 'w-full bg-gradient-to-r from-pink-400 to-rose-400 text-white font-bold py-3 rounded-lg' }, 'Book Now')
                )
              )
            )
          ) : activeTab === 'admin' ? e('div', { className: 'max-w-2xl mx-auto' },

              e('p', { className: 'text-xs text-gray-500 mt-4' }, 'Password: nailscape2024')
